# Nexo worker + its Redis queue. Server layout (everything in one folder):
#   ~/nexo/repo        git checkout of this repository
#   ~/nexo/worker.env  secrets (chmod 600), never committed
#   ~/nexo/redis/      redis.conf (password, chmod 600), tls/ (certificate), data/ (saved queue)
# The worker reaches Redis inside Docker (plain, port 6379, never published). Vercel reaches it over the internet
# on the TLS port 6390 only; see deploy/worker/setup-redis.sh.
name: nexo
services:
  redis:
    image: redis:7.4-alpine
    container_name: nexo-redis
    restart: unless-stopped
    # Run as the folder's owner so it can read its config and write data/ without root-owned files.
    user: "${NEXO_UID:-1000}:${NEXO_GID:-1000}"
    command: ["redis-server", "/conf/redis.conf"]
    volumes:
      - ${NEXO_DIR:-../../..}/redis/redis.conf:/conf/redis.conf:ro
      - ${NEXO_DIR:-../../..}/redis/tls:/tls:ro
      - ${NEXO_DIR:-../../..}/redis/data:/data
    ports:
      - "6390:6390"
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ../..
      dockerfile: deploy/worker/Dockerfile
    image: nexo-worker:latest
    container_name: nexo-worker
    restart: unless-stopped
    env_file: ${NEXO_ENV_FILE:-../../../worker.env}
    depends_on:
      - redis
    # Shares the server with other apps: cap what it can take.
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
