services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postline
      POSTGRES_PASSWORD: postline
      POSTGRES_DB: postline
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
volumes:
  pgdata:
